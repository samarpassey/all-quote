[project]
name = "allquote"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",      # Task 1 - schemas.py models
    "python-dotenv>=1.2",  # Task 1+ - .env config loading
    "browser-use>=0.13",   # Task 5 - browser executor agent
    "playwright>=1.62",    # Task 5 - browser automation runtime
    "cryptography>=50",    # Task 3 - Fernet vault
    "pillow>=12",           # Task 3 - redact.py image redaction
]

[dependency-groups]
dev = [
    "pytest>=9.1",          # Task 1 - test suite
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["allquote"]

[tool.pytest.ini_options]
# The browser-driven executor tests are excluded by default: they drive the
# machine's installed Google Chrome, whose version this project does not pin
# and cannot control, and the agent's tab is detached mid-run on Chrome 153.
# Run them with `make test-live` (or `pytest -m live_browser`).
addopts = "-m 'not live_browser'"
markers = [
    "live_browser: needs a stable local Chrome session; see README",
]
