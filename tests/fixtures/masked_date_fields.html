<!doctype html>
<html>
<head><title>Get a quote - masked date fields</title></head>
<body>
  <h1>Driver details</h1>
  <form>
    <label for="dob_masked">Date of birth</label>
    <input id="dob_masked" name="dob" type="text" placeholder="MM/DD/YYYY">

    <label for="dob_plain">Date of birth (no format hint)</label>
    <input id="dob_plain" name="dob2" type="text">

    <label for="issue_date_masked">Issue date</label>
    <input id="issue_date_masked" name="issueDate" type="text" placeholder="MM/DD/YYYY">
  </form>
</body>
</html>
