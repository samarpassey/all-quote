<!doctype html>
<html>
<head><title>secure.example.invalid - quote flow, province dropdown open</title></head>
<body>
  <h1>Get your quote</h1>
  <p>We will pull your driving record to verify your identity before showing a price.</p>
  <form>
    <label for="province">Province</label>
    <select id="province" name="province" size="4">
      <option value="ON">Ontario</option>
      <option value="AB">Alberta</option>
      <option value="BC">British Columbia</option>
    </select>
    <label for="licence_number">Driver's licence number</label>
    <input id="licence_number" name="licence_number" type="text" required>
    <button type="button" id="get_quote">Get quote</button>
  </form>
</body>
</html>
