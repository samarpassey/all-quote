<!doctype html>
<html>
<head><title>Get a quote - driver details</title></head>
<body>
  <h1>Driver details</h1>
  <form>
    <label for="first_name">First name</label>
    <input id="first_name" name="firstName" type="text">
    <label for="dob">Date of birth</label>
    <input id="dob" name="dob" type="text">
    <label for="street_address">Street address</label>
    <input id="street_address" name="address1" type="text">

    <label for="vehicle_make">Vehicle make</label>
    <input id="vehicle_make" name="make" type="text">
    <label for="vehicle_model">Vehicle model</label>
    <input id="vehicle_model" name="model" type="text">
    <label for="province">Province</label>
    <input id="province" name="province" type="text">
    <button type="submit" id="next">Next</button>
  </form>
</body>
</html>
